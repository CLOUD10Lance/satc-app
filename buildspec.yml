version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install pytest flake8
  pre_build:
    commands:
      - flake8 --max-line-length=100 test_app.py
      - chmod +x scripts/*.sh
  build:
    commands:
      - pytest -q
artifacts:
  files:
    - index.html
    - appspec.yml
    - scripts/**/*
